<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" />
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>JS Todo List</title>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">✓</span>
      <span class="brand-name">Tareas</span>
    </div>

    <nav class="sidebar-nav">
      <p class="sidebar-section-label">FILTROS</p>
      <form id="filters">
        <ul class="sidebar-menu">
          <li class="sidebar-filter-item">
            <label>
              <input type="radio" name="type" value="all" checked> Todas
            </label>
          </li>
          <li class="sidebar-filter-item">
            <label>
              <input type="radio" name="type" value="completed"> Completadas
            </label>
          </li>
          <li class="sidebar-filter-item">
            <label>
              <input type="radio" name="type" value="uncompleted"> Pendientes
            </label>
          </li>
        </ul>
        <div class="sidebar-search mt-3">
          <i class="fa fa-search"></i>
          <input type="search" name="words" placeholder="Buscar tarea..." />
          <button type="submit" id="search" style="display:none"></button>
        </div>
      </form>
    </nav>

    <div class="sidebar-footer">
      <i class="fa fa-cog"></i> Configuración
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="topbar-title">To-Do List</h1>
      </div>
    </header>

    <!-- ADD TASK -->
    <div class="add-task-row">
      <div class="add-task-card">
        <div class="add-task-fields">
          <div class="field-group">
            <label class="field-label">Título</label>
            <input type="text" id="title" class="task-input" placeholder="Nueva tarea..." />
          </div>
          <div class="field-group field-group--desc">
            <label class="field-label">Descripción</label>
            <input type="text" id="description" class="task-input" placeholder="Añade una descripción..." />
          </div>
          <button type="button" class="btn-add-task" id="add">
            <i class="fa fa-plus"></i> Agregar tarea
          </button>
        </div>
        <div class="alert custom-alert d-none" role="alert" id="alert">
          El título y la descripción son requeridos.
        </div>
      </div>
    </div>

    <!-- TASK TABLE -->
    <div class="task-list-wrapper">
      <table class="task-table" id="table">
        <thead>
          <tr>
            <th class="col-check"></th>
            <th class="col-title">Tarea</th>
            <th class="col-desc">Descripción</th>
            <th class="col-status text-center">Estado</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody>
          <!-- JS renders here -->
        </tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none">
        <span>+</span>
        <p>No hay tareas. ¡Agrega una arriba!</p>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content custom-modal">
        <div class="modal-header custom-modal-header">
          <h5 class="modal-title">Editar tarea</h5>
          <button type="button" class="close custom-close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body custom-modal-body">
          <div class="alert custom-alert d-none" role="alert" id="modal-alert">
            El título y la descripción son requeridos.
          </div>
          <form>
            <div class="form-group">
              <label class="field-label">Título</label>
              <input id="modal-title" type="text" class="task-input" placeholder="Título de la tarea" />
            </div>
            <div class="form-group">
              <label class="field-label">Descripción</label>
              <textarea class="task-input" id="modal-description" rows="3" placeholder="Descripción..."></textarea>
            </div>
            <div class="form-group d-flex align-items-center" style="gap:0.6rem">
              <label class="field-label mb-0">Completada</label>
              <input id="modal-completed" type="checkbox" class="task-checkbox" />
            </div>
          </form>
        </div>
        <div class="modal-footer custom-modal-footer">
          <button type="button" class="btn-modal-delete" data-dismiss="modal">Cancelar</button>
          <button type="button" class="btn-modal-save" id="modal-btn">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha256-4+XzXVhsDmqanXGHaHvgh1gMQKX40OUvDEBTu8JcmNs=" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
  <script src="js/index.js" type="module"></script>
</body>
</html>
